name: Build blog from Obsidian notes

on:
  push:
    branches: [main]
    paths:
      - "notes/**"
      - "scripts/**"
      - ".github/workflows/build-blog.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-blog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 日付のない記事に最初のコミット日を使うため

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/build_blog.py

      - name: Commit generated blog
        run: |
          git add -A blog
          if git diff --cached --quiet; then
            echo "変更はありません"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ブログを更新（Obsidianノートから自動生成）"
          git push
